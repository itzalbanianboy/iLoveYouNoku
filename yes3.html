<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iLoveYouNoku</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* =========================
   BODY
========================= */

body{

    font-family:Arial,sans-serif;

    height:6200px;

    overflow-x:hidden;

    position:relative;

    background:black;

}

/* =========================
   ANIMATED BACKGROUND
========================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background-image:url("photo1.jpg");
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;

    z-index:-1;

    animation:backgroundMove 12s ease-in-out infinite;

}

/* Zoom + Left/Right */

@keyframes backgroundMove{

    0%{

        transform:scale(1)
                  translateX(0px);

    }

    25%{

        transform:scale(1.06)
                  translateX(-35px);

    }

    50%{

        transform:scale(1.12)
                  translateX(35px);

    }

    75%{

        transform:scale(1.06)
                  translateX(-20px);

    }

    100%{

        transform:scale(1)
                  translateX(0px);

    }

}

/* =========================
   BUTTONS
========================= */

.infoBtn{

    position:absolute;

    left:800px;

    width:180px;
    height:55px;

    background:#3498db;
    color:white;

    border:none;
    border-radius:10px;

    font-size:18px;

    cursor:pointer;

}

#btn1{top:100px;}
#btn2{top:1100px;}
#btn3{top:2100px;}
#btn4{top:3100px;}
#btn5{top:4100px;}
#btn6{top:5100px;}

/* =========================
   POLAROIDS
========================= */

.polaroid{

    position:absolute;

    left:730px;

    width:320px;
    height:380px;

    background:white;

    padding:20px;
    padding-bottom:70px;

    box-shadow:0 10px 25px rgba(0,0,0,.5);

}

.polaroid img{

    width:100%;
    height:280px;

    object-fit:cover;

}

.caption{

    position:absolute;

    bottom:20px;
    left:0;

    width:100%;

    text-align:center;

    font-size:28px;

    font-family:"Comic Sans MS",cursive;

}

#photo1{
    top:350px;
    transform:rotate(-5deg);
}

#photo2{
    top:1350px;
    transform:rotate(5deg);
}

#photo3{
    top:2350px;
    transform:rotate(-5deg);
}

#photo4{
    top:3350px;
    transform:rotate(5deg);
}

#photo5{
    top:4350px;
    transform:rotate(-5deg);
}

#photo6{
    top:5350px;
    transform:rotate(5deg);
}

/* =========================
   POPUP
========================= */

#popup{

    display:none;

    position:fixed;

    left:24%;
    top:50%;

    transform:translate(-50%,-50%);

    width:650px;

    padding:25px;

    background:white;

    color:black;

    border-radius:12px;

    box-shadow:0 0 30px rgba(0,0,0,.4);

}

#doneBtn{

    width:140px;
    height:45px;

    margin-top:20px;

    background:#2ecc71;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

}

/* =========================
   FINAL BUTTON
========================= */

#finalBtn{

    position:fixed;

    left:30px;
    top:30px;

    width:250px;
    height:70px;

    background:#777;

    color:white;

    border:none;

    border-radius:10px;

    font-size:20px;

    cursor:not-allowed;

}

</style>

</head>

<body>

<!-- =========================
     BUTTONS
========================= -->

<button class="infoBtn" id="btn1">photo 1</button>

<button class="infoBtn" id="btn2">photo 2</button>

<button class="infoBtn" id="btn3">photo 3</button>

<button class="infoBtn" id="btn4">photo 4</button>

<button class="infoBtn" id="btn5">photo 5</button>

<button class="infoBtn" id="btn6">photo 6</button>

<!-- =========================
     POLAROIDS
========================= -->

<!-- =========================
     okey photo 1
========================= -->

<div class="polaroid" id="photo1">
    <img src="firstphoto.png" alt="">
    <div class="caption">Greece</div>
</div>
<!-- =========================
     okey photo 2
========================= -->

<div class="polaroid" id="photo2">
    <img src="photo2.jpg" alt="">
    <div class="caption">Tenerife</div>
</div>

<div class="polaroid" id="photo3">
    <img src="photo3.jpg" alt="">
    <div class="caption">la palma</div>
</div>

<!-- =========================
     okey photo 4
========================= -->


<div class="polaroid" id="photo4">
    <img src="photo4.jpg" alt="">
    <div class="caption">Holland</div>
</div>

<!-- =========================
     okey photo5
========================= -->


<div class="polaroid" id="photo5">
    <img src="photo5.png" alt="">
    <div class="caption">Ireland</div>
</div>

<div class="polaroid" id="photo6">
    <img src="japanphoto1.jpg" alt="">
    <div class="caption">Japan</div>
</div>

<!-- =========================
     FINAL BUTTON
========================= -->

<button id="finalBtn">
LOCKED
</button>

<!-- =========================
     POPUP
========================= -->

<div id="popup">

<h2 id="title"></h2>

<p id="text"></p>

<button id="doneBtn">
Done
</button>

</div>

<script>

/* =========================
   VARIABLES
========================= */

let completed=[];

let current="";

/* =========================
   BUTTON TEXTS
========================= */

const texts={

btn1:{
title:"Σαγαπώ",
text:"Everything started in Greece. Love with one eye contact."
},

btn2:{
title:"Te quero",
text:"We moved to your home island and i meet all of your family and friends."
},

btn3:{
title:"Te amo",
text:"After we travel to la palma."
},

btn4:{
title:"Ik houd van jou",
text:"The best 2 nights, even if was bad luck."
},

btn5:{
title:"I Love You",
text:"This was the first time I was independent and had my own house with you."
},

btn6:{
title:"私はあなたがとても大好きです。",
text:"We make your dream travel a reality."
}

};

/* =========================
   OPEN POPUP
========================= */

document.querySelectorAll(".infoBtn").forEach(btn=>{

btn.onclick=function(){

current=this.id;

title.innerHTML=texts[current].title;

text.innerHTML=texts[current].text;

popup.style.display="block";

};

});

/* =========================
   DONE
========================= */

doneBtn.onclick=function(){

popup.style.display="none";

if(!completed.includes(current)){

completed.push(current);

}

if(completed.length===6){

finalBtn.innerHTML="UNLOCK";

finalBtn.style.background="#2ecc71";

finalBtn.style.cursor="pointer";

}

};

/* =========================
   FINAL BUTTON
========================= */

finalBtn.onclick=function(){

if(completed.length===6){

window.location.href="yes4.html";

}

};

</script>

</body>
</html>
