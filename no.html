<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Undertale Dialogue</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("sansplace.png") center/cover no-repeat fixed;
}

.box{
    display:none;
    width:500px;
    padding:30px 40px;
    background:black;
    border:6px solid white;
    transform:translateY(-170px);
}

#text{
    color:white;
    font-family:'Press Start 2P', cursive;
    font-size:16px;
    line-height:1.8;
    text-align:center;
    text-shadow:2px 2px 0 #000;
    white-space:nowrap;
}

button{
    display:none;
    margin:35px auto 0;
    padding:12px 28px;
    background:black;
    color:white;
    border:4px solid white;
    font-family:'Press Start 2P', cursive;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:white;
    color:black;
}

</style>

</head>


<body>


<audio id="voice">
    <source src="just-sans-talking.mp3" type="audio/mpeg">
</audio>


<div class="box">

    <div id="text"></div>

    <button onclick="window.location.href='index.html'">
        Reconsider
    </button>

</div>


<script>

const message = "* You shouldn't be here.";

const text = document.getElementById("text");
const button = document.querySelector("button");
const box = document.querySelector(".box");
const sound = document.getElementById("voice");

let i = 0;


function type(){

    if(i < message.length){

        text.textContent += message.charAt(i);

        i++;

        setTimeout(type,60);

    }else{

        button.style.display="block";

    }

}


setTimeout(()=>{

    box.style.display="block";

    sound.play();

    type();

},3000);


</script>


</body>

</html>
