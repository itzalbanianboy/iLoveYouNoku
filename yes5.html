<!DOCTYPE html>
<html>

<head>

<title>Purple Neon Quiz Game</title>

<style>

* {
  box-sizing: border-box;
}


body {

  margin:0;

  height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  font-family:Arial,sans-serif;

  color:white;

  overflow:hidden;


  background:
  linear-gradient(45deg,#000000,#111111,#220033,#000000);


  background-size:400% 400%;

  animation:backgroundMove 10s infinite alternate;

}



@keyframes backgroundMove {

0% {

background-position:left;

}


100% {

background-position:right;

}

}




.quiz-box {


width:400px;

padding:40px;

text-align:center;


background:rgba(255,255,255,0.08);


backdrop-filter:blur(15px);


border:2px solid #b026ff;


border-radius:25px;


box-shadow:


0 0 20px #b026ff,

inset 0 0 20px rgba(176,38,255,0.3);


animation:appear 1s ease;


}





@keyframes appear {


from {

opacity:0;

transform:scale(.5);

}


to {

opacity:1;

transform:scale(1);

}


}





h1 {


color:#b026ff;


text-shadow:


0 0 10px #b026ff,

0 0 20px #b026ff;


}





#attempts {


font-size:20px;

color:#ffcc00;


}





#question {


min-height:60px;

animation:questionMove .5s;


}





@keyframes questionMove {


from {

opacity:0;

transform:translateY(-20px);


}


to {

opacity:1;

transform:translateY(0);


}


}





input {


width:85%;


padding:15px;


margin:20px 0;


border-radius:10px;


border:none;


outline:none;


text-align:center;


font-size:20px;


background:black;


color:white;


border:2px solid #b026ff;


}





input:focus {


box-shadow:0 0 20px #b026ff;


}





button {


padding:15px 40px;


border:none;


border-radius:50px;


background:#b026ff;


color:black;


font-size:18px;


font-weight:bold;


cursor:pointer;


transition:.3s;


}





button:hover {


transform:scale(1.1);


background:white;


box-shadow:0 0 25px white;


}





#message {


margin-top:25px;


font-size:25px;


font-weight:bold;


white-space:pre-line;


}





.success {


color:#b026ff;


animation:glow 1s infinite alternate;


}





.error {


color:red;


animation:shake .3s;


}





@keyframes glow {


from {


text-shadow:0 0 10px #b026ff;


}


to {


text-shadow:0 0 30px white;


}


}





@keyframes shake {


0% {

transform:translateX(0);

}


25% {

transform:translateX(-10px);

}


50% {

transform:translateX(10px);

}


100% {

transform:translateX(0);

}


}


</style>


</head>

<body>


<div class="quiz-box">


<h1>💜 Quiz Game 💜</h1>


<p id="attempts">
Attempts: 3
</p>


<h2 id="question"></h2>


<input
type="number"
id="answer"
placeholder="Enter answer"
>


<br>


<button id="submit">
Submit
</button>


<p id="message"></p>


</div>





<script>


const questions = [

{
question:
"How many Pokémons did you see in the Japan website?",
answer:9
},

{
question:
"How many photos did you see in the travel page?",
answer:7
}

];



let currentQuestion = 0;

let attempts = 3;

let gameEnded = false;



const question =
document.getElementById("question");


const answer =
document.getElementById("answer");


const submit =
document.getElementById("submit");


const attemptsText =
document.getElementById("attempts");


const message =
document.getElementById("message");






function showQuestion(){


question.style.animation="none";


setTimeout(()=>{


question.style.animation="questionMove .5s";


},10);



question.textContent =
questions[currentQuestion].question;


answer.value="";


}







function goNextPage(){


let count=3;


let timer=setInterval(()=>{


message.textContent += ".";


count--;



if(count===0){


clearInterval(timer);


window.location.href="yes6.html";


}


},1000);


}






function hideQuiz(){


document.querySelector("h1").style.display="none";

attemptsText.style.display="none";

question.style.display="none";

answer.style.display="none";

submit.style.display="none";


}








submit.onclick=function(){


if(gameEnded)return;



let playerAnswer =
Number(answer.value);





if(playerAnswer === questions[currentQuestion].answer){



currentQuestion++;




if(currentQuestion === questions.length){



gameEnded=true;


hideQuiz();



message.className="success";


message.textContent=
"You pass";



goNextPage();


}



else{


message.className="success";


message.textContent=
"✅ Correct!";



setTimeout(()=>{


showQuestion();


},700);



}



}





else{


attempts--;



if(attempts===0){



gameEnded=true;


hideQuiz();



message.className="error";


message.textContent=
"You failed";



goNextPage();


}



else{


message.className="error";


message.textContent=
"❌ Wrong Answer!";


attemptsText.textContent=
"Attempts: "+attempts;


}



}



};






showQuestion();


</script>


</body>

</html>
